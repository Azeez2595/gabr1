name: "Terraform CI/CD"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write # Required for OIDC authentication
  contents: read  # Required to checkout the code
  pull-requests: write # Required to post plan comments on PRs

jobs:
  terraform:
    name: "Terraform CI/CD"
    runs-on: ubuntu-latest
    env:
      # AWS credentials can be swapped out if using Azure or GCP
      AWS_REGION: "us-east-1"
      ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_ARN }} 

    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configure Cloud Credentials securely via OIDC (Recommended over static keys)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Set up the Terraform CLI on the runner
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0" # Specify your desired Terraform version

      # 4. Check that all Terraform configuration files adhere to canonical formatting
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check

      # 5. Initialize the configuration and download necessary providers
      - name: Terraform Init
        id: init
        run: terraform init

      # 6. Validate the configuration files for syntactical correctness
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # 7. Generate a speculative plan (Runs on Pull Requests)
      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color -input=false
        continue-on-error: true

      # 8. Post the plan output to the PR description (Runs on Pull Requests)
      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"

      # 9. Halt the workflow if the plan stage failed
      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # 10. Apply the configuration (Runs ONLY on merge/push to the main branch)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
