name: Secure DevSecOps Pipeline

on:
  push:
    branches:
      - master


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  security-events: write
  id-token: write
  packages: write

jobs:
  security_audit:
    name: CodeQL SAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  build_and_package:
    name: Build Docker Image
    needs: security_audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241

      - name: Verify Trivy
        run: trivy --version

      - name: Run Trivy Filesystem Scan
        continue-on-error: true
        run: |
          trivy fs \
            --format sarif \
            --output trivy-fs.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            .

      - name: Verify SARIF
        run: |
          pwd
          ls -la
          find . -name "*.sarif"

      - name: Upload Trivy Scan Results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./trivy-fs.sarif

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Export Container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: rahamshaik/gabr1:latest

          cache-from: type=registry,ref=rahamshaik/gabr1:latest
          cache-to: type=registry,ref=rahamshaik/gabr1:buildcache,mode=max

