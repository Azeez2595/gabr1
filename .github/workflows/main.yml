name: Secure DevSecOps Pipeline

on:
  push:
    branches:
      - master

jobs:
  build_and_package:
    name: BUILD-JOB
    runs-on: ubuntu-slim

    permissions:
      actions: read
      contents: read
      security-events: write # Required to upload findings to the Security tab

    strategy:
      fail-fast: false
      matrix:
        # Specify the languages you want to analyze
        language: ['javascript-typescript']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
             ${{ runner.os }}-node-

      - name: BUILD
        run: npm install

      - name: TEST
        run: echo "code is tested!"

      - name: Artifact upload
        uses: actions/upload-artifact@v7
        with:
          name: artifact-1
          path: |
            package*
