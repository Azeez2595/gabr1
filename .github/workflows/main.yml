name: Secure DevSecOps Pipeline

on:
  push:
    branches:
      - master

jobs:
  build_and_package:
    name: BUILD-JOB
    runs-on: ${{ matrix.os }} # Dynamically chooses the OS
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest] 
        node-version: [18, 20, 22] # Defines version variables
        language: ['javascript-typescript']

    permissions:
      actions: read
      contents: read
      security-events: write # Required to upload findings to the Security tab


    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: BUILD
        run: npm install

      - name: TEST
        run: echo "code is tested!"

      - name: Artifact upload
        uses: actions/upload-artifact@v7
        with:
          name: artifact-1
          path: |
            package*
